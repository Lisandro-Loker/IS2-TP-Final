[project]
site_name = "IS2 TP Final"
site_url = "https://Lisandro-Loker.github.io/IS2-TP-Final/"
repo_url = "https://github.com/Lisandro-Loker/IS2-TP-Final"
repo_name = "Lisandro-Loker/IS2-TP-Final"

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = "usage.md" },
  { "API Reference" = "api.md" },
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
